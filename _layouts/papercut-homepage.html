<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description | escape }}">
  <meta name="keywords" content="{{ site.keywords | escape }}">
  <meta name="theme-color" content="#F3EDE0">
  <title>YIFAN LIU | {{ site.affiliation }}</title>
  <link rel="canonical" href="{{ site.canonical }}">
  <meta property="og:title" content="YIFAN LIU | Robot Learning">
  <meta property="og:description" content="Bimanual and dexterous manipulation. Research, projects, and updates.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.canonical }}">
  <meta property="og:image" content="{{ '/assets/img/avatar.webp' | absolute_url }}">
  <link rel="icon" href="{{ site.favicon | relative_url }}" type="image/png">
  <link rel="preload" href="{{ '/assets/papercut/fonts/BricolageGrotesque.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/papercut-primitives.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="stylesheet" href="{{ '/assets/css/papercut-home.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script src="{{ '/assets/js/papercut-primitives.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  <script src="{{ '/assets/js/papercut-home.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</head>
<body id="top">
  <a class="skip-link" href="#about">Skip to content</a>
  <header class="masthead">
    <a class="wordmark" href="#top" aria-label="YIFAN LIU, home"><span class="riso" data-ink="YIFAN LIU" aria-hidden="true">YIFAN LIU</span></a>
    <nav aria-label="Main navigation">
      <a href="#about" aria-current="location">About</a>
      <a href="#news">News</a>
      <a href="#experience">Intern</a>
      <a href="#projects">Projects</a>
    </nav>
  </header>
  <main>{{ content }}</main>
  <footer class="footer paper" id="contact">
    <div class="footer-copy">
      <h2 aria-label="Let’s talk" class="riso" data-ink="LET’S TALK.">LET’S TALK.</h2>
    </div>
    <div class="contact-scrap scrap" data-paper-seed="81">
      <span class="tape tape--blue tape--close-a" aria-hidden="true"></span><span class="tape tape--pink tape--close-b" aria-hidden="true"></span>
      <a class="email" href="mailto:{{ site.email }}">{{ site.email }} <span aria-hidden="true">↗</span></a>
      <a href="{{ site.github_link }}" target="_blank" rel="noopener noreferrer">{{ site.github_link | remove: "https://" | remove: "http://" }} ↗</a>
    </div>
    <div class="footer-bottom mono"><span>© {{ 'now' | date: '%Y' }} YIFAN LIU</span><a href="#top">Back to top ↑</a></div>
  </footer>
  <dialog class="media-dialog" aria-labelledby="dialog-title">
    <div class="dialog-header"><h2 id="dialog-title">Project demo</h2><button type="button" class="close-dialog">Close <span aria-hidden="true">×</span></button></div>
    <div class="dialog-media"></div>
    <p class="dialog-caption"></p>
    <div class="dialog-context"></div>
  </dialog>
  <div class="sr-only" role="status" aria-live="polite" id="site-status"></div>
  {% if site.google_analytics %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','{{ site.google_analytics }}');</script>
  {% endif %}
</body>
</html>
