<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ site.description | escape }}">
  <meta name="keywords" content="{{ site.keywords | escape }}">
  <title>{{ site.title }} | {{ site.affiliation }}</title>
  <link rel="canonical" href="{{ site.canonical }}">
  <link rel="icon" href="{{ site.favicon | relative_url }}" type="image/png">
  <link rel="preload" href="{{ '/assets/fonts/Anton-Regular.ttf' | relative_url }}" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/halftone-home.css?v=20261007-portrait-gradient-7' | relative_url }}">
  <script src="{{ '/assets/js/halftone-home.js?v=20261007-portrait-gradient-7' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#about">Skip to content</a>
  <div class="sheet">
    <canvas id="halftone-name" aria-hidden="true"></canvas>
    <header class="masthead">
      <a class="wordmark" href="#top" aria-label="Yifan Liu, home">YIFAN LIU</a>
      <nav aria-label="Main navigation"><a href="#news">News</a><a href="#experience">Experience</a></nav>
      <a class="contact-link" href="mailto:{{ site.email }}">gmail <span aria-hidden="true">↗</span></a>
    </header>
    <main>
      <section class="poster" id="top" aria-label="Yifan Liu">
        <div class="name-art"><h1>YIFAN LIU</h1></div>
        <div class="identity-caption">
          <p class="research-focus">Embodied AI · Bimanual Manipulation · Dexterous Manipulation</p>
          <p class="affiliation">{{ site.position }} · {{ site.affiliation }}</p>
        </div>
      </section>
      {{ content }}
    </main>
    <footer><p>YIFAN LIU</p><a href="#top">Back to top <span aria-hidden="true">↑</span></a></footer>
  </div>
  {% if site.google_analytics %}
  <script>
    (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
    (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
    m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
    })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
    ga('create', '{{ site.google_analytics }}', 'auto');
    ga('send', 'pageview');
  </script>
  {% endif %}
</body>
</html>
